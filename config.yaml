job:
  project_name: nbr_germany_2024_final

runtime:
  process_folder: /drive_mount/process
  force_ard_dir: /force/C1/L2/ard
  force_image: davidfrantz/force:latest
  docker_cmd: docker
  mounts:
    - /drive_mount:/drive_mount
    - /force:/force

processing:
  mode: UDF # TSA or UDF. If UDF a FILE_PYTHON must be provided in parameters
  execute: true # set to false if only parameter file should be created
  mosaic: true 
  hold: false # for debug purpose only

# Final Int8 mosaic encoding. Change these values after comparing the small
# samples produced by utils/benchmark_mosaic_compression.py.
mosaic_output:
  compression: LERC_ZSTD # Lossless because max_z_error is 0
  interleave: BAND
  zstd_level: 19
  block_size: 512
  predictor: 2 # Ignored by LERC_ZSTD; retained for switching back to ZSTD
  max_z_error: 0 # Exact, lossless storage
  exclude_months: [1, 2, 11, 12] # Final mosaic contains March through October
  scale_factor: 0.01 # Physical NBR = stored integer multiplied by this value
  apply_scale_metadata: false # Keep QGIS display/type as raw Int8, not Float32
  short_band_names: true # Band 1: 201803, ..., Band 8: 201810
  build_overviews: true # Internal pyramids make country-wide display fast in QGIS
  overview_resampling: average # NBR is continuous; nodata is excluded by GDAL
  overview_levels: [2, 4, 8, 16, 32, 64, 128]

inputs:
  aois:
    - /drive_mount/general_data/germany/2024_v1_0.shp
    #- /drive_mount/general_data/germany/1tile_extent.shp
parameters:
  DATE_RANGE: 2024-01-01 2024-12-31 # Format: YYYY-MM-DD
  DOY_RANGE: 1 365 # DOY range for filtering the time extent. Day-of-Years that are outside the given interval will be ignored.
  INDEX: NBR # Used in TSA mode; standalone UDF mode receives the full BOA stack
  METRIC: MEDIAN # Used to name the final UDF mosaic
  SENSORS: SEN2A SEN2B SEN2C # LND08 LND09 SEN2A SEN2B SEN2C
  TARGET_SENSOR: SEN2L # SEN2L (for Sentinel only) OR LNDLG (for Landsat (and Sentinel))
  SPECTRAL_ADJUST: FALSE # TRUE if Sentinel and Landsat is used
  RESOLUTION: 10 # 30 if working with Landsat

  FILE_PYTHON: utils/templates/monthly_median_nbr.py # Resolved against the selected source revision
  PYTHON_TYPE: CHUNK # Vectorized processing; much faster than one Python call per pixel
  FILL_INTERNAL_MONTH_GAPS: true # Interpolate only gaps bounded by valid months in the same year

  # Advanced parameters
  STREAMING: TRUE # for faster computation. However, this can cause error messages when working with UDFs
  OUTPUT_SUBFOLDERS: TRUE
  CHUNK_SIZE: 6000 6000 # 25 chunks per 30 km tile; reduce if memory is insufficient
  ABOVE_NOISE: 3
  BELOW_NOISE: 1
  NTHREAD_READ: 10
  NTHREAD_COMPUTE: 22 # FORCE does not parallelize CHUNK UDF computation
  NTHREAD_WRITE: 8
